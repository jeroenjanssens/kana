<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Learn hiragana and katakana with spaced repetition." />
    <meta name="theme-color" content="#1c1b19" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="kana" />
    <title>kana — learn hiragana & katakana</title>
    <style>
      /* Shown until the app has loaded. (Colours go on #boot, not html: a background on html
         would stop body's background from reaching the canvas and hide the photo layer.) */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #ebe3d4;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: #221f1b;
        }
      }
      #boot span {
        font: 600 28px/1 serif;
        color: #fff8f0;
        background: #b13a1c;
        padding: 10px 8px;
        border-radius: 8px;
        writing-mode: vertical-rl;
        letter-spacing: 0.08em;
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.2);
        animation: boot 1.6s ease-in-out infinite alternate;
      }
      @keyframes boot {
        from {
          opacity: 0.55;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span>仮名</span></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
