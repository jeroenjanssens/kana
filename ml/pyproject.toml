[project]
name = "kana-speech"
version = "0.1.0"
description = "Train the kana app's offline speech model: which kana sound was said"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.1",
  "torch>=2.6",
  "soundfile>=0.13",
  "httpx>=0.28",
  "tqdm>=4.67",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
